<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Content Dashboard</title>
    <!-- Anti-flash: apply saved theme before render -->
    <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ── Dark theme (default) ── */
      :root {
        --bg: #0c0c0c;
        --surface: #161616;
        --surface-2: #1c1c1c;
        --border: #282828;
        --text: #ededed;
        --text-2: #a1a1a1;
        --text-3: #6b6b6b;
        --accent: #c9a87a;
        --accent-2: #dbbf91;
        --accent-3: #a88952;
        --danger: #f87171;
        --radius: 12px;
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --shadow-lg: 0 32px 80px rgba(0, 0, 0, 0.6);
        --glow: rgba(201, 168, 122, 0.05);
      }
      /* ── Light theme ── */
      [data-theme="light"] {
        --bg: #f5f5f5;
        --surface: #ffffff;
        --surface-2: #f0f0f0;
        --border: #e2e2e2;
        --text: #111111;
        --text-2: #4b5563;
        --text-3: #9ca3af;
        --danger: #dc2626;
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.1);
        --glow: rgba(201, 168, 122, 0.06);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--bg);
        background-image: radial-gradient(ellipse 180% 90% at 50% -10%, var(--glow) 0%, transparent 60%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      .card {
        width: min(400px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.75rem;
      }
      .brand-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      .brand-name {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        flex: 1;
      }
      /* Theme toggle */
      .theme-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-3);
        cursor: pointer;
        padding: 0.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
        flex-shrink: 0;
      }
      .theme-btn:hover { color: var(--text-2); border-color: var(--accent); background: var(--surface-2); }
      .icon-moon, .icon-sun { display: none; }
      :root[data-theme="dark"]  .icon-moon { display: block; }
      :root[data-theme="light"] .icon-sun  { display: block; }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 0.35rem;
        color: var(--text);
      }
      .sub {
        font-size: 0.88rem;
        color: var(--text-2);
        margin-bottom: 1.75rem;
        line-height: 1.5;
      }
      .field { margin-bottom: 1.1rem; }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 0.4rem;
        letter-spacing: 0.02em;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 0.92rem;
        transition: border-color 0.15s, box-shadow 0.15s;
        outline: none;
      }
      input::placeholder { color: var(--text-3); }
      input:focus {
        border-color: rgba(201, 168, 122, 0.5);
        box-shadow: 0 0 0 3px rgba(201, 168, 122, 0.1);
      }
      .error-msg {
        color: var(--danger);
        font-size: 0.83rem;
        min-height: 1.25em;
        margin-bottom: 0.85rem;
      }
      button[type="submit"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent), var(--accent-3));
        color: #fff;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s, box-shadow 0.15s;
        box-shadow: 0 4px 16px rgba(201, 168, 122, 0.25);
        letter-spacing: 0.01em;
        margin-top: 0.25rem;
      }
      button[type="submit"]:hover {
        filter: brightness(1.08);
        box-shadow: 0 6px 24px rgba(201, 168, 122, 0.35);
      }
      button[type="submit"]:active { transform: translateY(1px); }
      button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      button[type="submit"]:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">Content Dashboard</span>
        <button type="button" class="theme-btn" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema claro/escuro">
          <!-- moon icon (shown in dark mode) -->
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <!-- sun icon (shown in light mode) -->
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
      <h1>Entrar</h1>
      <p class="sub">Bem-vindo de volta. Acesse sua conta.</p>
      <div class="error-msg" id="err" role="alert" aria-live="polite"></div>
      <form id="form" method="post" action="#" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="btn">Entrar</button>
      </form>
    </div>
    <script>
      /* Theme toggle */
      document.getElementById("theme-toggle").addEventListener("click", function() {
        const cur = document.documentElement.getAttribute("data-theme") || "dark";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });

      const form = document.getElementById("form");
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");

      /* Enter no e-mail com a senha ainda vazia enviava o formulário e voltava
         "credenciais inválidas", parecendo que o Enter não funcionava. Aqui ele
         pula para a senha; o Enter na senha é que entra. */
      document.getElementById("email").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const pwd = document.getElementById("password");
        if (!pwd.value) {
          e.preventDefault();
          pwd.focus();
        }
      });

      const inviteToken = new URL(window.location.href).searchParams.get("inviteToken");
      if (inviteToken) {
        document.getElementById("email").readOnly = true;
        fetch(`/api/invites/${encodeURIComponent(inviteToken)}`)
          .then((r) => r.json())
          .then((data) => {
            if (data.email) {
              document.getElementById("email").value = data.email;
            }
          })
          .catch(() => {});
        document.querySelector("h1").textContent = "Criar conta";
        document.querySelector(".sub").textContent = "Defina uma senha para ativar seu acesso.";
        const pwdLabel = document.querySelector("label[for='password']");
        pwdLabel.textContent = "Escolha uma senha (mín. 8 caracteres)";
        btn.textContent = "Criar conta";
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.textContent = "";
          const password = document.getElementById("password").value;
          if (password.length < 8) {
            err.textContent = "A senha deve ter pelo menos 8 caracteres.";
            return;
          }
          btn.disabled = true;
          btn.textContent = "Criando…";
          try {
            const res = await fetch(`/api/invites/${encodeURIComponent(inviteToken)}/accept`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ password }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              err.textContent = data.error || "Não foi possível criar a conta.";
              return;
            }
            window.location.href = "/login.html";
          } catch {
            err.textContent = "Erro de rede. Tente de novo.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Criar conta";
          }
        });
      } else {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.textContent = "";
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          btn.disabled = true;
          btn.textContent = "Entrando…";
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              err.textContent = data.error || "Credenciais inválidas.";
              return;
            }
            window.location.href = "/index.html";
          } catch {
            err.textContent = "Erro de rede. Tente de novo.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        });
      }
    </script>
  </body>
</html>
