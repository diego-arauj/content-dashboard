<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Content Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #120e0a;
        --surface: #1c1510;
        --surface-2: #261e16;
        --border: #3f3228;
        --text: #f5f0eb;
        --text-2: #b5a898;
        --text-3: #7d7268;
        --accent: #c9a87a;
        --accent-2: #dbbf91;
        --accent-3: #a88952;
        --danger: #c88080;
        --radius: 12px;
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --shadow-lg: 0 32px 80px rgba(0, 0, 0, 0.55);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 180% 90% at 50% -10%, rgba(150, 110, 60, 0.18) 0%, transparent 55%),
          radial-gradient(ellipse 80% 50% at 80% 110%, rgba(100, 70, 30, 0.08) 0%, transparent 50%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      /* scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      .card {
        width: min(400px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.75rem;
      }
      .brand-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 8px rgba(124, 90, 243, 0.5);
      }
      .brand-name {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-2);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 0.35rem;
        color: var(--text);
      }
      .sub {
        font-size: 0.88rem;
        color: var(--text-2);
        margin-bottom: 1.75rem;
        line-height: 1.5;
      }
      .field { margin-bottom: 1.1rem; }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 0.4rem;
        letter-spacing: 0.02em;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 0.92rem;
        transition: border-color 0.15s, box-shadow 0.15s;
        outline: none;
      }
      input::placeholder { color: var(--text-3); }
      input:focus {
        border-color: rgba(201, 168, 122, 0.5);
        box-shadow: 0 0 0 3px rgba(201, 168, 122, 0.1);
      }
      .error-msg {
        color: var(--danger);
        font-size: 0.83rem;
        min-height: 1.25em;
        margin-bottom: 0.85rem;
      }
      button[type="submit"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--accent), var(--accent-3));
        color: #fff;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s, box-shadow 0.15s;
        box-shadow: 0 4px 16px rgba(201, 168, 122, 0.25);
        letter-spacing: 0.01em;
        margin-top: 0.25rem;
      }
      button[type="submit"]:hover {
        filter: brightness(1.08);
        box-shadow: 0 6px 24px rgba(201, 168, 122, 0.35);
      }
      button[type="submit"]:active { transform: translateY(1px); }
      button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      button[type="submit"]:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">Content Dashboard</span>
      </div>
      <h1>Entrar</h1>
      <p class="sub">Bem-vindo de volta. Acesse sua conta.</p>
      <div class="error-msg" id="err" role="alert" aria-live="polite"></div>
      <form id="form" method="post" action="#" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="btn">Entrar</button>
      </form>
    </div>
    <script>
      const form = document.getElementById("form");
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");

      const inviteToken = new URL(window.location.href).searchParams.get("inviteToken");
      if (inviteToken) {
        document.getElementById("email").readOnly = true;
        fetch(`/api/invites/${encodeURIComponent(inviteToken)}`)
          .then((r) => r.json())
          .then((data) => {
            if (data.email) {
              document.getElementById("email").value = data.email;
            }
          })
          .catch(() => {});
        document.querySelector("h1").textContent = "Criar conta";
        document.querySelector(".sub").textContent = "Defina uma senha para ativar seu acesso.";
        const pwdLabel = document.querySelector("label[for='password']");
        pwdLabel.textContent = "Escolha uma senha (mín. 8 caracteres)";
        btn.textContent = "Criar conta";
        btn.addEventListener("click", () => {}, { once: false });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.textContent = "";
          const password = document.getElementById("password").value;
          if (password.length < 8) {
            err.textContent = "A senha deve ter pelo menos 8 caracteres.";
            return;
          }
          btn.disabled = true;
          btn.textContent = "Criando…";
          try {
            const res = await fetch(`/api/invites/${encodeURIComponent(inviteToken)}/accept`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ password }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              err.textContent = data.error || "Não foi possível criar a conta.";
              return;
            }
            window.location.href = "/login.html";
          } catch {
            err.textContent = "Erro de rede. Tente de novo.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Criar conta";
          }
        });
      } else {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.textContent = "";
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          btn.disabled = true;
          btn.textContent = "Entrando…";
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              err.textContent = data.error || "Credenciais inválidas.";
              return;
            }
            window.location.href = "/index.html";
          } catch {
            err.textContent = "Erro de rede. Tente de novo.";
          } finally {
            btn.disabled = false;
            btn.textContent = "Entrar";
          }
        });
      }
    </script>
  </body>
</html>
