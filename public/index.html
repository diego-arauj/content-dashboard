<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientes — Content Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #09090e;
        --surface: #0f0f18;
        --surface-2: #15151f;
        --surface-3: #1c1c2a;
        --border: #22223a;
        --border-hover: #2e2e50;
        --text: #f0f0f8;
        --text-2: #9898b4;
        --text-3: #64647a;
        --accent: #7c5af3;
        --accent-2: #a78bfa;
        --accent-3: #5b3fd6;
        --accent-bg: rgba(124, 90, 243, 0.08);
        --accent-border: rgba(124, 90, 243, 0.25);
        --success: #22c55e;
        --success-bg: rgba(34, 197, 94, 0.08);
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.5);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: var(--bg);
        background-image: radial-gradient(ellipse 180% 70% at 50% -5%, rgba(100, 60, 230, 0.15) 0%, transparent 55%);
        color: var(--text);
        min-height: 100vh;
        font-size: 0.93rem;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      /* ── Layout ── */
      .shell {
        max-width: 1160px;
        margin: 0 auto;
        padding: 2rem clamp(1rem, 4vw, 2.5rem) 4rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 8px rgba(124, 90, 243, 0.5);
        flex-shrink: 0;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }

      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text-2);
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface-3);
        border-color: var(--border-hover);
        color: var(--text);
      }
      .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-3));
        border-color: transparent;
        color: #fff;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(124, 90, 243, 0.28);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
        background: linear-gradient(135deg, var(--accent), var(--accent-3));
        box-shadow: 0 6px 20px rgba(124, 90, 243, 0.38);
      }
      .btn.sm { padding: 0.35rem 0.65rem; font-size: 0.8rem; }
      .btn.danger {
        background: var(--danger-bg);
        border-color: rgba(239, 68, 68, 0.2);
        color: var(--danger);
      }
      .btn.danger:hover {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.35);
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

      /* ── Grid ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.35rem 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
        opacity: 0;
        transition: opacity 0.2s;
      }
      .card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .card:hover::before { opacity: 1; }
      .card h2 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.015em;
      }
      .card .niche {
        font-size: 0.82rem;
        color: var(--text-3);
        min-height: 1.2rem;
      }
      .card .meta {
        font-size: 0.78rem;
        color: var(--text-3);
        margin-top: 0.15rem;
      }
      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.75rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--border);
      }

      /* ── Modal ── */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 50;
      }
      .overlay.open { display: flex; }
      .modal {
        width: min(440px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: var(--shadow-lg);
        position: relative;
        overflow: hidden;
      }
      .modal::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
      }
      .modal h3 {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 1.25rem;
        color: var(--text);
      }
      .modal label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 0.35rem;
        letter-spacing: 0.02em;
      }
      .modal input,
      .modal select {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .modal input::placeholder { color: var(--text-3); }
      .modal input:focus,
      .modal select:focus {
        border-color: rgba(124, 90, 243, 0.55);
        box-shadow: 0 0 0 3px rgba(124, 90, 243, 0.1);
      }
      .modal select option { background: var(--surface-2); }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .toast {
        margin-top: 1rem;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius-sm);
        font-size: 0.83rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        word-break: break-all;
        line-height: 1.45;
        color: var(--text-2);
      }
      .toast.success {
        background: var(--success-bg);
        border-color: rgba(34, 197, 94, 0.2);
        color: var(--success);
      }

      /* ── States ── */
      .loading {
        color: var(--text-3);
        padding: 3rem;
        text-align: center;
        font-size: 0.9rem;
      }
      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--text-3);
        font-size: 0.88rem;
      }
      .empty-state strong {
        display: block;
        font-size: 1rem;
        color: var(--text-2);
        margin-bottom: 0.35rem;
      }

      /* ── Logout ── */
      .header-right { display: flex; align-items: center; gap: 0.5rem; }
      .logout-btn {
        font: inherit;
        font-size: 0.8rem;
        background: none;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        padding: 0.35rem 0.6rem;
        border-radius: var(--radius-sm);
        transition: color 0.15s, background 0.15s;
      }
      .logout-btn:hover { color: var(--text-2); background: var(--surface-2); }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="header-left">
          <div class="brand-dot"></div>
          <h1>Clientes</h1>
        </div>
        <div class="header-right actions">
          <button type="button" class="btn primary" id="btn-new">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Novo cliente
          </button>
          <button type="button" class="btn" id="btn-invite">Convidar cliente</button>
          <button type="button" class="logout-btn" id="btn-logout">Sair</button>
        </div>
      </header>
      <div id="list" class="loading">Carregando clientes…</div>
    </div>

    <!-- Modal: Novo cliente -->
    <div class="overlay" id="modal-new" role="dialog" aria-modal="true" aria-labelledby="modal-new-title">
      <div class="modal">
        <h3 id="modal-new-title">Novo cliente</h3>
        <form id="form-new">
          <label for="nf-name">Nome</label>
          <input id="nf-name" autocomplete="off" placeholder="Ex: Marca X" required />
          <label for="nf-niche">Nicho (opcional)</label>
          <input id="nf-niche" autocomplete="off" placeholder="Ex: Moda, Gastronomia…" />
          <div class="modal-actions">
            <button type="button" class="btn" id="nf-cancel">Cancelar</button>
            <button type="submit" class="btn primary">Criar cliente</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Convidar -->
    <div class="overlay" id="modal-invite" role="dialog" aria-modal="true" aria-labelledby="modal-invite-title">
      <div class="modal">
        <h3 id="modal-invite-title">Convidar cliente</h3>
        <form id="form-invite">
          <label for="inv-client">Cliente</label>
          <select id="inv-client" required>
            <option value="">Selecione…</option>
          </select>
          <label for="inv-email">E-mail</label>
          <input id="inv-email" type="email" autocomplete="off" placeholder="cliente@email.com" required />
          <div class="modal-actions">
            <button type="button" class="btn" id="inv-cancel">Fechar</button>
            <button type="submit" class="btn primary">Enviar convite</button>
          </div>
        </form>
        <div id="inv-toast" class="toast" style="display:none"></div>
      </div>
    </div>

    <script>
      const api = (path, opts) => fetch(path, { credentials: "include", ...opts });

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function formatDate(iso) {
        if (!iso) return "";
        return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" });
      }

      function openModal(el) {
        el.classList.add("open");
        el.setAttribute("aria-hidden", "false");
        el.querySelector("input, select")?.focus();
      }
      function closeModal(el) {
        el.classList.remove("open");
        el.setAttribute("aria-hidden", "true");
      }

      async function ensureSession() {
        const res = await api("/api/auth/me");
        if (res.status === 401) { window.location.href = "/login.html"; return null; }
        const me = await res.json();
        if (me.role === "client") {
          window.location.href = me.clientId
            ? `/dashboard.html?client=${encodeURIComponent(me.clientId)}`
            : "/dashboard.html";
          return null;
        }
        if (me.role !== "admin") { window.location.href = "/login.html"; return null; }
        return me;
      }

      async function loadClients() {
        const res = await api("/api/clients");
        const list = document.getElementById("list");
        if (!res.ok) {
          list.innerHTML = '<p class="empty-state"><strong>Erro ao carregar</strong>Não foi possível buscar os clientes.</p>';
          return;
        }
        const clients = await res.json();
        if (!clients.length) {
          list.className = "";
          list.innerHTML = '<div class="empty-state"><strong>Nenhum cliente ainda</strong>Crie o primeiro cliente para começar.</div>';
          return;
        }
        list.className = "grid";
        list.innerHTML = clients.map((c) => `
          <article class="card" data-id="${c.id}">
            <h2>${escapeHtml(c.name || "—")}</h2>
            <p class="niche">${escapeHtml(c.niche || "Sem nicho")}</p>
            <p class="meta">Criado em ${formatDate(c.created_at)}</p>
            <div class="card-actions">
              <button type="button" class="btn sm primary" data-open-dash>Abrir dashboard</button>
              <button type="button" class="btn sm" data-sync>Sincronizar</button>
              <button type="button" class="btn sm" data-invite-one>Convidar</button>
              <button type="button" class="btn sm" data-connect-ig>Conectar Instagram</button>
              <button type="button" class="btn sm danger" data-delete>Apagar</button>
            </div>
          </article>`).join("");
        populateInviteSelect(clients);
      }

      function populateInviteSelect(clients) {
        const sel = document.getElementById("inv-client");
        sel.innerHTML = '<option value="">Selecione…</option>' +
          clients.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
      }

      /* ── Event handlers ── */
      document.getElementById("btn-new").addEventListener("click", () => openModal(document.getElementById("modal-new")));
      document.getElementById("nf-cancel").addEventListener("click", () => closeModal(document.getElementById("modal-new")));
      document.getElementById("btn-invite").addEventListener("click", () => openInviteModal(null));
      document.getElementById("inv-cancel").addEventListener("click", () => closeModal(document.getElementById("modal-invite")));

      document.getElementById("btn-logout").addEventListener("click", async () => {
        await api("/api/auth/logout", { method: "POST" });
        window.location.href = "/login.html";
      });

      document.querySelectorAll(".overlay").forEach((ov) => {
        ov.addEventListener("click", (e) => { if (e.target === ov) closeModal(ov); });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") document.querySelectorAll(".overlay.open").forEach(closeModal);
      });

      document.getElementById("form-new").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("nf-name").value.trim();
        const niche = document.getElementById("nf-niche").value.trim();
        if (!name) return;
        const btn = e.target.querySelector('[type="submit"]');
        btn.disabled = true;
        const res = await api("/api/clients", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, niche: niche || null }),
        });
        btn.disabled = false;
        if (!res.ok) { alert("Não foi possível criar o cliente."); return; }
        closeModal(document.getElementById("modal-new"));
        e.target.reset();
        await loadClients();
      });

      function openInviteModal(preselectId) {
        document.getElementById("inv-toast").style.display = "none";
        document.getElementById("form-invite").reset();
        if (preselectId) document.getElementById("inv-client").value = preselectId;
        openModal(document.getElementById("modal-invite"));
      }

      document.getElementById("form-invite").addEventListener("submit", async (e) => {
        e.preventDefault();
        const clientId = document.getElementById("inv-client").value;
        const email = document.getElementById("inv-email").value.trim();
        if (!clientId || !email) return;
        const btn = e.target.querySelector('[type="submit"]');
        btn.disabled = true;
        const res = await api(`/api/clients/${clientId}/invite`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        btn.disabled = false;
        const toast = document.getElementById("inv-toast");
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          toast.style.display = "block";
          toast.className = "toast";
          toast.textContent = data.error || "Falha ao convidar.";
          return;
        }
        const link = `${window.location.origin}/login.html?inviteToken=${encodeURIComponent(data.token)}`;
        toast.style.display = "block";
        toast.className = "toast success";
        toast.textContent = "Link de convite: " + link;
      });

      document.getElementById("list").addEventListener("click", async (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        const id = card.getAttribute("data-id");
        if (!id) return;

        if (e.target.closest("[data-open-dash]")) {
          window.location.href = `/dashboard.html?client=${encodeURIComponent(id)}`;
          return;
        }
        if (e.target.closest("[data-invite-one]")) { openInviteModal(id); return; }
        if (e.target.closest("[data-connect-ig]")) {
          window.location.href = "/api/auth/instagram/start/" + id;
          return;
        }
        if (e.target.closest("[data-delete]")) {
          if (!confirm("Apagar este cliente e todos os seus dados? Esta ação não pode ser desfeita.")) return;
          const r = await api("/api/clients/" + id, { method: "DELETE" });
          if (!r.ok) {
            const errBody = await r.json().catch(() => ({}));
            alert(errBody.error || "Não foi possível apagar o cliente.");
            return;
          }
          await loadClients();
          return;
        }
        const syncBtn = e.target.closest("[data-sync]");
        if (syncBtn) {
          syncBtn.disabled = true;
          syncBtn.textContent = "Sincronizando…";
          try {
            const r = await api(`/api/instagram/sync/${id}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: "{}",
            });
            if (!r.ok) {
              const errBody = await r.json().catch(() => ({}));
              alert(errBody.error || "Falha ao sincronizar.");
              return;
            }
            syncBtn.textContent = "Sincronizado ✓";
            setTimeout(() => { syncBtn.textContent = "Sincronizar"; syncBtn.disabled = false; }, 2500);
          } catch {
            alert("Erro de rede.");
            syncBtn.disabled = false;
            syncBtn.textContent = "Sincronizar";
          }
        }
      });

      (async () => {
        const me = await ensureSession();
        if (!me) return;
        await loadClients();
      })();
    </script>
  </body>
</html>
